name: ci

on:
  push:
  pull_request:

jobs:
  gates:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: npm ci
      - run: npm run bindings:check
      - run: npm run typecheck
      - run: npm run lint
      - run: npx vitest run
      - run: cargo test --workspace
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: npm run build
      - run: PLAYWRIGHT_BROWSERS_PATH=0 npx playwright install --with-deps webkit
      - run: npm run e2e
