[package]
name = "teamcode-core"
version = "0.1.0"
edition = "2021"
description = "Team Code domain, pipeline and persistence (no Tauri dependency)"

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
chrono = { version = "0.4", features = ["serde"] }
livespec-core = { path = "../livespec-core" }
rusqlite = { version = "0.32", features = ["bundled"] }
tokio = { workspace = true }
specta = { version = "=2.0.0-rc.22", features = ["derive", "chrono", "serde_json"] }

[features]
# exposes `sessions::fake` to the shell's tests
test-support = []

[dev-dependencies]
tempfile = "3"
tokio = { workspace = true, features = ["net"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls-native-roots"] }
specta-typescript = "=0.0.9"
