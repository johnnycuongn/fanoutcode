[package]
name = "teamcode-core"
version = "0.1.0"
edition = "2021"
description = "Team Code domain, pipeline and persistence (no Tauri dependency)"

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
chrono = { version = "0.4", features = ["serde"] }
livespec-core = { path = "../livespec-core" }
specta = { version = "=2.0.0-rc.22", features = ["derive", "chrono"] }

[dev-dependencies]
specta-typescript = "=0.0.9"
