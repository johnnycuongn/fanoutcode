[package]
name = "teamcode"
version = "0.1.0"
edition = "2021"
description = "Team Code: a Kanban board of AI coding agents, one terminal per task"
default-run = "teamcode"

[lib]
name = "teamcode_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
teamcode-core = { path = "../crates/teamcode-core" }
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-window-state = "2"
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
chrono = "0.4"
rusqlite = { version = "0.32", features = ["bundled"] }
tauri-specta = { version = "=2.0.0-rc.21", features = ["derive", "typescript"] }
specta = { version = "=2.0.0-rc.22", features = ["derive", "chrono", "serde_json"] }
specta-typescript = "=0.0.9"
notify = "8"
livespec-core = { path = "../crates/livespec-core" }
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls-native-roots"] }
keyring = { version = "=3.6.3", features = ["apple-native"] }
tauri-plugin-notification = "2"
portable-pty = "0.9"
which = "7"
libc = "0.2"

[dev-dependencies]
tempfile = "3"
teamcode-core = { path = "../crates/teamcode-core", features = ["test-support"] }
